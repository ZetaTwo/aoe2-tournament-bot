name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/zetatwo/aoe2-tournament-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    # NOTE: deliberately NOT a dependency of `deploy` — fmt/clippy noise must
    # not block a fix from shipping.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --tests -- -D warnings

  # Builds+pushes a :sha image on every push to main, for release.yml to
  # promote. No staging tier: Discord allows one gateway connection per token.
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-and-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # build-push-action v6 defaults to emitting provenance/SBOM
          # attestations, which turns the push into an OCI image index.
          # Keep a single-manifest image so `:<sha>` pinning stays simple.
          provenance: false
          # Immutable per-commit tag only — release.yml promotes this exact
          # tag, so no floating :latest.
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # The `buildcache` tag keeps the cargo-chef dependency layer across
          # CI runs; GHCR has no automatic cleanup policy excluding it, so
          # prune old buildcache manually if storage ever becomes a concern.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
