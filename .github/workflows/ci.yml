name: CI

on:
  # branches: [main] avoids a spurious extra run from the tag push a
  # release creates, which would otherwise race deploy-production for the
  # same concurrency group.
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/zetatwo/aoe2-tournament-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    # NOTE: deliberately NOT a dependency of `deploy` — fmt/clippy noise must
    # not block a fix from shipping.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --tests -- -D warnings

  # Builds+pushes a :sha image on every push to main so there's always a
  # tested, promotable artifact once a release is cut — this job no longer
  # deploys anything itself. Production deploys are release-gated (see
  # deploy-production below): the bot only allows one gateway connection
  # per bot token, so there's no staging tier to deploy to on every push.
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-and-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # build-push-action v6 defaults to emitting provenance/SBOM
          # attestations, which turns the push into an OCI image index.
          # Keep a single-manifest image so `:<sha>` pinning stays simple.
          provenance: false
          # Immutable per-commit tag only — deploy-production promotes this
          # exact tag by digest, so no floating :latest.
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # The `buildcache` tag keeps the cargo-chef dependency layer across
          # CI runs; GHCR has no automatic cleanup policy excluding it, so
          # prune old buildcache manually if storage ever becomes a concern.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  # Promotes the exact image already built+pushed by build-and-push for the
  # release's commit — retags it, never rebuilds, so what ships to
  # production is bit-identical to what was tagged for release.
  deploy-production:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release commit SHA
        id: release_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the released commit has a built image
        run: |
          docker buildx imagetools inspect \
            "${{ env.IMAGE_NAME }}:${{ steps.release_sha.outputs.sha }}" \
            || { echo "::error::No image tagged :${{ steps.release_sha.outputs.sha }} in GHCR — this release's commit was never built+pushed by build-and-push. Tag the release from a commit that's actually on main." >&2; exit 1; }

      - name: Promote the tested image to the release tag (retag, no rebuild)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}" \
            "${{ env.IMAGE_NAME }}:${{ steps.release_sha.outputs.sha }}"

      # ZetaTwo/infrastructure's deploy workflow pins the deployment to the
      # newest release tag; this job never writes to that repo.
      - name: Trigger infrastructure deploy
        uses: ZetaTwo/infrastructure/.github/actions/trigger-deploy@main
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
